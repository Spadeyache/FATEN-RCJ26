# Variants matrix for the export sweep.
#
# Each entry produces exports/<name>/{model.kmodel, deploy_config.json,
# summary.json, eval.csv, eval_summary.json, debug/}.
#
# preprocess_mode controls what nncase bakes in:
#   baked_imagenet  - input_range=[0,1], mean=ImageNet, std=ImageNet
#   raw_01          - input_range=[0,1], mean=[0,0,0],  std=[1,1,1]      (only /255 dequant)
#   raw_0_255       - input_range=[0,255], mean=[0,0,0], std=[255,255,255]  (alt /255 form)
#
# ptq.code maps to convert_canaan.py's table.
# PTQ_OPTIONS[code] = (calibrate_method, activation_type, weight_type).
# In deploy_config notation, that's (method, d, w).
#   0: NoClip  d:uint8  w:uint8
#   1: NoClip  d:uint8  w:int16
#   2: NoClip  d:int16  w:uint8
#   3: Kld     d:uint8  w:uint8
#   4: Kld     d:uint8  w:int16
#   5: Kld     d:int16  w:uint8       <-- activation int16, the hypothesis-1 fix
#
# Always uses target=k230, swapRB=false, input_type=uint8, input_layout=NCHW.

defaults:
  # Paths are RELATIVE to the working dir at run time.
  # When running inside the Docker container per docs/DOCKER_PIPELINE.md, the
  # container has /k230-train mounted at the root, so set cwd to /k230-train.
  onnx_path: data/anchorbasedet_reconstructed.onnx
  calib_dir: data/calibration
  calib_count: 16
  input_width: 640
  input_height: 480
  swapRB: false

variants:

  - name: v04_baked_imagenet_kld_i16act_u8w
    preprocess_mode: baked_imagenet
    ptq:
      code: 5
      calibrate_method: Kld
      w_quant_type: uint8
      quant_type: int16
    mode: direct                          # direct nncase compile (no diagnose, no mix)
    purpose: "Activation int16 -- hypothesis 1 fix for head quant damage."

  - name: v06_baked_imagenet_kld_u8u8
    preprocess_mode: baked_imagenet
    ptq:
      code: 3
      calibrate_method: Kld
      w_quant_type: uint8
      quant_type: uint8
    mode: direct
    purpose: "Reproduce AI Cube settings via our pipeline -- sanity check."

  - name: v09_raw01_mixquant
    preprocess_mode: baked_imagenet
    ptq:
      code: 3
      calibrate_method: Kld
      w_quant_type: uint8
      quant_type: uint8
    mode: mixquant
    mixquant:
      diagnose_from: v06_baked_imagenet_kld_u8u8    # use v06 quant_scheme.json
      promote_heads_to: int16                        # detection head layers -> int16
    purpose: "MixQuant -- selective head promotion to int16, minimal size penalty."
